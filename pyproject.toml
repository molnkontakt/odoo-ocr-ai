[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__manifest__.py" = ["B018"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["odoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
